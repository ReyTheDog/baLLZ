name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Unzip and build
        run: |
          unzip -q "$(ls *.zip | head -1)" -d src_project
          cd "$(dirname "$(find src_project -name build.gradle | head -1)")"
          gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: dannys-aot-shiftball
          path: |
            src_project/**/build/libs/*.jar
            !src_project/**/build/libs/*-sources.jar
